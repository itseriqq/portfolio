  <body>

    <!-- The plain file. Screen readers and reduced-motion visitors get this.

    <!-- HUD -->

    <!-- The film -->
    <div id="stage" aria-hidden="true">
      <svg class="scene" id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b1230" />
            <stop offset="1" stop-color="#26244a" />
          </linearGradient>
          <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6d8fd8" />
            <stop offset=".6" stop-color="#f2b59a" />
            <stop offset="1" stop-color="#ffd9a1" />
          </linearGradient>
          <radialGradient id="g-pool" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ffd59a" stop-opacity=".55" />
            <stop offset="1" stop-color="#ffd59a" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="g-screen" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#9fb8ff" stop-opacity=".35" />
            <stop offset="1" stop-color="#9fb8ff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="g-cone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe2b0" stop-opacity=".35" />
            <stop offset="1" stop-color="#ffe2b0" stop-opacity="0" />
          </linearGradient>
          <clipPath id="clip-window"><rect x="1090" y="130" width="380" height="380" /></clipPath>
        </defs>

        <!-- wall -->
        <rect x="-2000" y="-2000" width="6000" height="5000" fill="#2a2b33" />
        
        <!-- window -->
        <g id="window">
          <g clip-path="url(#clip-window)">
            <rect x="1090" y="130" width="380" height="380" fill="url(#g-night)" />
            <rect id="dawn" x="1090" y="130" width="380" height="380" fill="url(#g-dawn)" opacity="0" />
            <circle id="sun" cx="1280" cy="560" r="46" fill="#fff1c9" opacity="0" />
            <path id="city" fill="#141522" d="M1090 510V400h30v-30h26v50h22v-80h40v60h18v-40h34v70h20v-110h46v90h24v-50h30v60h22v-30h28v40h40v80z" />
            <g id="city-lights" fill="#ffd86b">
              <rect x="1172" y="360" width="6" height="6" /><rect x="1186" y="378" width="6" height="6" />
              <rect x="1262" y="330" width="6" height="6" /><rect x="1276" y="350" width="6" height="6" />
              <rect x="1262" y="384" width="6" height="6" /><rect x="1340" y="430" width="6" height="6" />
              <rect x="1104" y="420" width="6" height="6" /><rect x="1420" y="452" width="6" height="6" />
              <rect x="1226" y="420" width="6" height="6" /><rect x="1392" y="470" width="6" height="6" />
            </g>
          </g>
          <rect x="1090" y="130" width="380" height="380" fill="none" stroke="#17181d" stroke-width="14" />
          <path d="M1280 130v380M1090 320h380" stroke="#17181d" stroke-width="8" />
          <rect x="1070" y="510" width="420" height="16" fill="#1d1e24" />
        </g>

        <!-- architecture connectors (drawn in chapter 4) -->
        <g id="wires" fill="none" stroke="#d7ff3a" stroke-width="3" stroke-linecap="round"></g>
        <g id="wire-labels" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#d7ff3a" text-anchor="middle" opacity="0"></g>

        <!-- desk -->
        <rect x="-2000" y="700" width="6000" height="2000" fill="#17181d" />
        <rect x="-2000" y="690" width="6000" height="14" fill="#3b2f27" />
        <rect id="pool" x="40" y="640" width="760" height="120" fill="url(#g-pool)" opacity="0" />

        <!-- lamp -->
        <g id="lamp">
          <polygon id="cone" points="292,462 352,462 560,700 70,700" fill="url(#g-cone)" opacity="0" />
          <ellipse cx="180" cy="690" rx="70" ry="12" fill="#101116" />
          <path d="M180 688L220 520L320 440" stroke="#101116" stroke-width="10" fill="none" stroke-linejoin="round" />
          <circle cx="220" cy="520" r="9" fill="#101116" />
          <g id="lamp-head">
            <path d="M285 408L372 450L352 478L268 440Z" fill="#101116" />
            <ellipse id="bulb" cx="322" cy="464" rx="26" ry="9" fill="#ffe7b8" opacity=".08" transform="rotate(24 322 464)" />
          </g>
        </g>

        <!-- notepad (where the sticky notes start) -->
        <rect x="420" y="664" width="104" height="30" rx="3" fill="#cfc6b5" />

        <!-- laptop -->
        <g id="laptop">
          <rect id="screen-glow" x="520" y="380" width="480" height="380" fill="url(#g-screen)" opacity="0" />
          <g id="lid">
            <rect x="610" y="520" width="300" height="170" rx="8" fill="#0f1014" />
            <rect id="screen" x="622" y="532" width="276" height="146" rx="3" fill="#161a2c" />
            <g id="code">
              <rect x="636" y="546" width="60" height="7" rx="2" fill="#d7ff3a" />
              <rect x="636" y="562" width="140" height="7" rx="2" fill="#7f8bb8" />
              <rect x="652" y="578" width="110" height="7" rx="2" fill="#7f8bb8" />
              <rect x="652" y="594" width="170" height="7" rx="2" fill="#c3cbe8" />
              <rect x="668" y="610" width="90" height="7" rx="2" fill="#ff8f6b" />
              <rect x="652" y="626" width="130" height="7" rx="2" fill="#7f8bb8" />
              <rect x="636" y="642" width="40" height="7" rx="2" fill="#c3cbe8" />
              <rect id="caret" x="682" y="642" width="7" height="12" fill="#d7ff3a" />
            </g>
          </g>
          <path d="M580 690H940L960 704H560Z" fill="#202229" />

          <rect x="996" y="640" width="72" height="60" rx="8" fill="#d0583a" />
        </g>

        <!-- phone -->
        <g id="phone">
          <rect x="1160" y="688" width="92" height="12" rx="4" fill="#0e0f13" />
          <rect id="phone-light" x="1166" y="689" width="80" height="4" rx="2" fill="#d7ff3a" opacity="0" />
        </g>

        <!-- plant -->
        <g id="plant">
          <g id="leaves" fill="#4f7a4a">
            <ellipse cx="1390" cy="560" rx="16" ry="58" transform="rotate(-26 1390 600)" />
            <ellipse cx="1410" cy="550" rx="16" ry="66" />
            <ellipse cx="1430" cy="566" rx="16" ry="56" transform="rotate(28 1430 600)" fill="#5f8e57" />
            <ellipse cx="1372" cy="592" rx="12" ry="40" transform="rotate(-52 1380 620)" fill="#5f8e57" />
          </g>
          <path d="M1370 620H1450L1440 700H1380Z" fill="#8a5b3f" />
        </g>

        <!-- sticky notes: drawn at the origin, positioned by GSAP -->
        <g id="notes" font-family="JetBrains Mono, monospace"></g>

        <!-- darkness -->
        <rect id="dark" x="-2000" y="-2000" width="6000" height="5000" fill="#06070a" opacity=".86" pointer-events="none" />
      </svg>

      <div class="grain"></div>

      <div class="caps" id="caps"></div>
      <p class="hint" id="hint"><b id="hint-t">scroll</b> <span>↓</span></p>
    </div>

    <div id="scroll"></div>

    <script type="module" src="/src/main.js"></script>
